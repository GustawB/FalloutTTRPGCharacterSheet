name: Validate rules data

on:
  pull_request:
    paths: ["data/**", "scripts/**", ".github/workflows/validate-data.yml"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", ".github/workflows/validate-data.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts -v
      - run: python3 scripts/validate_rules.py
