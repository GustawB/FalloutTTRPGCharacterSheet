name: Claude Autopilot

# Fully autonomous build loop: implement the next unblocked roadmap issue,
# review it, merge it if checks pass, then dispatch itself again. It stops when
# no work is left. Kill switch: set the repo variable CLAUDE_AUTOPILOT=off.
#
# Merges use GITHUB_TOKEN, so they don't fire `pull_request: closed`. The loop
# continues via `workflow_dispatch`, which GITHUB_TOKEN is allowed to trigger.
#
# Every iteration either merges its issue or labels it `blocked` (the `next`
# job), so the loop can't stall on a crashed or empty run, and it always ends.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: claude-autopilot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    if: >-
      vars.CLAUDE_AUTOPILOT != 'off' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure labels
        run: |
          gh label create autopilot --color 0e8a16 --description "PR opened by Claude Autopilot" --force
          gh label create blocked --color b60205 --description "Autopilot gave up; skipped" --force
          gh label create retried --color fbca04 --description "Autopilot failed once for a non-check reason; next failure blocks" --force

      # Lowest-numbered open phase-* issue, not blocked, whose "## Depends on"
      # issues are all closed. Empty output = nothing left, and the loop ends.
      - id: pick
        name: Pick the next issue
        run: |
          for n in $(gh issue list --state open --limit 200 --json number,labels \
              -q '[.[] | select(any(.labels[]; .name | startswith("phase-"))) | select(all(.labels[]; .name != "blocked")) | .number] | sort | .[]'); do
            deps=$(gh issue view "$n" --json body -q .body | awk '/^## Depends on/{f=1; next} /^## /{f=0} f' | grep -o '#[0-9]\+' | tr -d '#' || true)
            ok=1
            for d in $deps; do
              [ "$(gh issue view "$d" --json state -q .state)" = CLOSED ] || { ok=0; break; }
            done
            if [ "$ok" = 1 ]; then echo "issue=$n" >> "$GITHUB_OUTPUT"; echo "Picked #$n"; break; fi
          done

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.issue != ''
        with:
          node-version: "22"

      # Agent mode allows only the tools listed here. Without Edit/Write the
      # agent can't change a single file.
      - name: Implement the issue
        if: steps.pick.outputs.issue != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*" # self-dispatched runs are triggered by github-actions[bot]
          claude_args: |
            --allowed-tools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep"
          prompt: |
            You are the autonomous build agent for this repo. No human will
            answer questions, so make every decision yourself. Read CLAUDE.md,
            ERRATA.md and ROADMAP.md first and follow ROADMAP.md's "How to work".

            Implement issue #${{ steps.pick.outputs.issue }}. Comment on it that
            you're starting. Work on a new branch, run the checks from
            ROADMAP.md until they pass, and open a PR labelled `autopilot`
            whose body says "Closes #${{ steps.pick.outputs.issue }}" and lists
            any "Rulings to confirm". If you can't finish, open no PR and
            comment on the issue why.

      - id: pr
        name: Find the autopilot PR
        if: steps.pick.outputs.issue != ''
        # Not `gh pr list --label`: that goes through the search API, which can
        # lag a fresh PR by seconds (PR #57 was missed and then closed).
        run: |
          for _ in 1 2 3 4 5 6; do
            n=$(gh pr list --state open --json number,labels -q '[.[] | select(any(.labels[]; .name == "autopilot")) | .number][0] // empty')
            [ -n "$n" ] && break
            sleep 10
          done
          echo "number=$n" >> "$GITHUB_OUTPUT"

  review:
    needs: build
    if: needs.build.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gh pr checkout ${{ needs.build.outputs.pr }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Review and fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*" # self-dispatched runs are triggered by github-actions[bot]
          claude_args: |
            --allowed-tools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep"
          prompt: |
            You are the reviewer for PR #${{ needs.build.outputs.pr }}, which is
            checked out. Another agent wrote it, so don't trust it. Read
            CLAUDE.md, ERRATA.md, ROADMAP.md, the linked issue and the full diff.

            Check correctness against the rules, the issue's acceptance
            criteria, test coverage, the breakdown rule for derived numbers,
            and that docs match the code. Fix every problem you find yourself,
            commit, and push to the PR branch. Don't wait for anyone. Then run
            the checks from ROADMAP.md until they pass, and post a short review
            comment on the PR listing what you changed.

  merge:
    needs: [build, review]
    if: always() && needs.build.outputs.pr != '' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      checks: ${{ steps.checks.outcome }}
    env:
      PR: ${{ needs.build.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gh pr checkout "$PR"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checks
        id: checks
        continue-on-error: true
        run: |
          python3 -m unittest discover -s scripts
          python3 scripts/validate_rules.py --quiet
          if [ -f package.json ]; then
            npm ci
            npm run typecheck --if-present
            npm test --if-present
          fi

      - name: Merge
        if: steps.checks.outcome == 'success'
        run: |
          gh pr merge "$PR" --squash --delete-branch
          gh issue close "${{ needs.build.outputs.issue }}" --reason completed || true

  # Runs whatever happened above, so a crash can't stop the chain. Red checks
  # block the issue. Any other failure (no PR, crash, timeout, outage) gets one
  # retry, tracked by the `retried` label, and the second one blocks. So the
  # loop still terminates.
  next:
    needs: [build, review, merge]
    if: always() && vars.CLAUDE_AUTOPILOT != 'off' && needs.build.outputs.issue != ''
    runs-on: ubuntu-latest
    env:
      ISSUE: ${{ needs.build.outputs.issue }}
      CHECKS: ${{ needs.merge.outputs.checks }}
      RESULTS: "build: ${{ needs.build.result }}, review: ${{ needs.review.result }}, merge: ${{ needs.merge.result }}, checks: ${{ needs.merge.outputs.checks || 'not run' }}"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Block or retry anything left unfinished
        run: |
          for pr in $(gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,labels -q '.[] | select(any(.labels[]; .name == "autopilot")) | .number'); do
            gh pr close "$pr" -R "$GITHUB_REPOSITORY" --delete-branch --comment "Autopilot: this iteration didn't finish ($RESULTS, $RUN_URL). Closing."
          done
          [ "$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json state -q .state)" = OPEN ] || exit 0
          retried=$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json labels -q 'any(.labels[]; .name == "retried")')
          if [ "$CHECKS" = failure ] || [ "$retried" = true ]; then
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label blocked
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Autopilot didn't get this merged ($RESULTS, $RUN_URL). Skipping. Remove the \`blocked\` (and \`retried\`) label to retry."
          else
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label retried
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Autopilot didn't get this merged, but not because of failing checks ($RESULTS, $RUN_URL). Retrying once."
          fi

      - name: Next iteration
        run: gh workflow run claude-next.yml -R "$GITHUB_REPOSITORY" --ref main
